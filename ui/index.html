<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Better Cores</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1 data-i18n="title">Cores</h1>
      <p class="muted" data-i18n="intro"></p>
      <table id="cores">
        <thead>
          <tr>
            <th data-i18n="colCore"></th>
            <th data-i18n="colPanel"></th>
            <th data-i18n="colRunning"></th>
            <th data-i18n="colLatest"></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="row">
        <button id="refresh" data-i18n="refresh"></button>
      </div>
      <p id="message" class="message" role="status"></p>
    </main>
    <script src="lucx-ui.js"></script>
    <script src="app.js"></script>
  </body>
</html>
